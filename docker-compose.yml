services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kba_postgres
    environment:
      POSTGRES_DB: kba
      POSTGRES_USER: kba
      POSTGRES_PASSWORD: kba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kba"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kba_net

  redis:
    image: redis:7-alpine
    container_name: kba_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kba_net

  minio:
    image: minio/minio:latest
    container_name: kba_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kba_net

  api:
    build:
      context: ./kba
      dockerfile: Dockerfile
    container_name: kba_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kba_net

  worker:
    build:
      context: ./kba
      dockerfile: Dockerfile
    container_name: kba_worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://kba:kba@postgres:5432/kba
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=kba
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kba_net

  flower:
    image: mher/flower
    container_name: kba_flower
    command: celery -A app.workers.celery_app flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    networks:
      - kba_net

  nginx:
    image: nginx:alpine
    container_name: kba_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - kba_net

networks:
  kba_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data: